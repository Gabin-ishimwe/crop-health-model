[tool.poetry]
name = "crop-health-model"
version = "0.1.0"
description = "Machine learning model for crop health prediction"
authors = ["Gil Tinde <gil.tinde@knowit.no>"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.2.1"
torchvision = "^0.17.1"
numpy = "<2.0"
lightning = "^2.2.1"
pandas = "^2.2.1"
rarfile = "^4.1"
httpx = "^0.27.0"
jsonargparse = {extras = ["signatures"], version = "^4.27.6"}
tensorboard = "^2.16.2"
matplotlib = "^3.8.3"
ipykernel = "^6.29.4"
pyyaml = "^6.0.1"
torch-model-archiver = "^0.10.0"
pytest = "^8.2.1"

[tool.poetry.group.dev.dependencies]
black = "^24.2.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"